id = "mojols"
name = "mojols"
version = "0.1.0"
schema_version = 1
authors = ["David Dada <davidtofunmidada@gmail.com>"]
description = "mojols language server for Mojo: crash-proof, workspace-aware, works alongside the Mojo extension."
repository = "https://github.com/obadafidii/mojols"

# Language server only. The Mojo language (grammar, highlighting, snippets)
# comes from the `mojo` extension; mojols attaches to it by name.
[language_servers.mojols]
name = "mojols"
languages = ["Mojo"]
