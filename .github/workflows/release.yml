name: release

# Push a tag like v0.1.0 to publish a release. The Zed extension downloads
# mojols_<os>_<arch>.tar.gz from the latest non-prerelease release, so the
# asset names here must match editors/zed/src/lib.rs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: test
        run: make test
      - name: build archives
        run: VERSION="${GITHUB_REF_NAME}" ./scripts/release.sh
      - name: smoke-test the linux/amd64 binary
        run: |
          mkdir smoke && tar -xzf dist/mojols_linux_amd64.tar.gz -C smoke
          smoke/mojols version | tee /dev/stderr | grep -q "${GITHUB_REF_NAME}"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt \
            --title "mojols ${GITHUB_REF_NAME}" --generate-notes $prerelease
